  '/api/v1/appointments/{appointment_code}/status':
    patch:
      summary: "Cambia el estado de una cita respetando la máquina de estados de\nAppointmentStatusService (transición válida + rol autorizado)."
      operationId: cambiaElEstadoDeUnaCitaRespetandoLaMquinaDeEstadosDeAppointmentStatusServicetransicinVlida+RolAutorizado
      description: "Antes exigía hasRole('barbero') y contradecía a la propia máquina de\nestados: ROLE_MAP ya declaraba a administrador y recepcionista\nautorizados en TODAS las transiciones, pero este guard les devolvía 403,\ny roleCanSet() quedaba sin usarse en todo el proyecto. Como PUT\n/appointments/{cita} exige el payload completo con\n'fecha' => after_or_equal:today, el efecto neto era que recepción no\npodía marcar \"no asistió\" ni \"completada\" en una cita del día anterior\npor ningún camino — justo cuando un no-show se marca después del hecho.\n\nEl barbero sigue acotado a SUS citas. El rol cliente no entra aquí\naunque ROLE_MAP lo liste para 'cancelada': cancela con DELETE\n/appointments/{cita}, que además valida su propia ventana de tiempo.\n\nActualizar Estado de Cita\n\nCambia solo el estado (y opcionalmente las notas), sin exigir el payload\ncompleto de la cita. Permitido a administrador, recepcionista y al\nbarbero asignado."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Estado actualizado correctamente.'
                  data:
                    code: jfb7ffye
                    estado: confirmada
                properties:
                  message:
                    type: string
                    example: 'Estado actualizado correctamente.'
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: jfb7ffye
                      estado:
                        type: string
                        example: confirmada
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Solo puedes cambiar el estado de tus propias citas.'
                properties:
                  message:
                    type: string
                    example: 'Solo puedes cambiar el estado de tus propias citas.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "No se puede pasar la cita de 'completada' a 'pendiente'."
                properties:
                  message:
                    type: string
                    example: "No se puede pasar la cita de 'completada' a 'pendiente'."
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  description: 'Estado destino. Debe ser una transición válida desde el estado actual.'
                  example: confirmada
                notas:
                  type: string
                  description: 'Notas opcionales de la cita.'
                  example: 'Llegó 5 minutos tarde.'
                  nullable: true
              required:
                - estado
    parameters:
      -
        in: path
        name: appointment_code
        description: ''
        example: fxp9vtie
        required: true
        schema:
          type: string
      -
        in: path
