openapi: 3.0.3
info:
  title: 'UrbanBlade API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Analítica
    description: ''
  -
    name: Autenticación
    description: "\nEndpoints para el manejo de sesiones de usuario (token Bearer propio,\ntabla mobile_api_tokens — no Sanctum)."
  -
    name: 'Catálogo público'
    description: ''
  -
    name: Citas
    description: "\nGestión de citas para clientes, barberos y administración."
  -
    name: 'Corte de caja'
    description: "\nCierre de caja del día para mostrador: qué esperaba el sistema, cuánto\nefectivo se contó y la diferencia. Administración y recepción, que es quien\ncierra el turno."
  -
    name: 'Depósitos anti-no-show'
    description: "\nCobro del depósito exigido a un cliente con historial reciente de\ninasistencias (ver DepositService), mientras su cita sigue 'pendiente' de\naprobación por el barbero. Vive separado de Payment\\PaymentController: ese\ncontrolador solo opera sobre citas ya aprobadas (CHARGEABLE)."
  -
    name: Endpoints
    description: ''
  -
    name: 'Gestión de Chatbot'
    description: "\nEndpoints para gestionar el chatbot (historial, perfil, estadísticas)."
  -
    name: 'Gestión de Perfil'
    description: "\nEndpoints para gestionar el perfil del usuario autenticado."
  -
    name: 'Gestión de cita por enlace'
    description: "\nDeja que un cliente vea, reagende o cancele SU cita desde el enlace del\nrecordatorio, sin iniciar sesión. Antes el recordatorio mandaba a\n/my/appointments, detrás de middleware ['auth','client']: quien no\nrecordaba su contraseña simplemente no iba, y eso se traduce en no-shows.\n\nAutoriza el token opaco de la cita, no una sesión\n(AppointmentManageLinkService). Aplica exactamente las mismas reglas que\nel cliente autenticado: solo citas pendientes/confirmadas y futuras, y la\nventana de cancelación configurada por la barbería. El enlace no puede ser\nuna puerta más permisiva que la app."
  -
    name: 'Horarios de Barbero'
    description: "\nEndpoints para gestionar los horarios del barbero."
  -
    name: 'Inteligencia artificial'
    description: "\nResumen del día en lenguaje natural para el inicio de recepción y de administración."
  -
    name: Inventario
    description: "\nGestión de productos, stock y movimientos de almacén."
  -
    name: 'Lista de espera'
    description: "\nUn cliente se anota cuando un barbero+servicio+fecha ya no tiene\nhorarios disponibles, para que se le avise si se libera uno."
  -
    name: Membresías
    description: "\nSuscripción mensual recurrente (roadmap P1, vía Stripe Subscriptions) que\notorga un descuento % en cada servicio mientras esté activa. La venta y el\ncobro real de las renovaciones ocurren enteramente en Stripe -- este\ncontrolador solo contrata, consulta y cancela."
  -
    name: Pagos
    description: ''
  -
    name: 'Paquetes prepagados'
    description: "\nCatálogo de paquetes disponibles, compra (efectivo por staff o tarjeta\nvía Stripe) y consulta de los paquetes de un cliente."
  -
    name: Pedidos
    description: ''
  -
    name: 'Portafolio de Barbero'
    description: "\nEndpoints para gestionar el portafolio de trabajos del barbero."
  -
    name: Referidos
    description: "\nCada cliente tiene un código propio para invitar. Quien invita gana\npuntos de lealtad cuando la persona referida completa su primera cita\n(nunca por solo registrarse) -- ver ReferralService."
  -
    name: 'Tarjetas de regalo'
    description: "\nCompra (efectivo por staff o tarjeta vía Stripe) y consulta de saldo por\ncódigo. El canje real ocurre en PaymentController::store() vía\n\"codigo_gift_card\" -- este controlador no cobra nada."
paths:
  /api/v1/analytics:
    get:
      summary: "Análisis por rol. operational es un resumen actual de citas/pagos,\nexclusivo para administrador y recepción; los insights históricos se conservan."
      operationId: anlisisPorRolOperationalEsUnResumenActualDeCitaspagosExclusivoParaAdministradorYRecepcinLosInsightsHistricosSeConservan
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado.'
      tags:
        - Analítica
  /api/v1/auth/login:
    post:
      summary: 'Iniciar Sesión'
      operationId: iniciarSesin
      description: 'Autentica al usuario y devuelve un token de acceso para la API móvil.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Autenticación exitosa.'
                  token_type: Bearer
                  token: TOKEN_DE_EJEMPLO
                  expires_at: '2026-11-04T12:00:00.000000Z'
                  user:
                    id: 6710a1b2c3d4e5f607182930
                    name: 'Juan Pérez'
                    email: juan@example.com
                    avatar_url: 'https://urbanblade.example/storage/avatars/juan.jpg'
                    roles:
                      - cliente
                    profile_complete: true
                    profile_missing:
                      - telefono
                    client_id: 6710a1b2c3d4e5f607182931
                    barber_id: 6710a1b2c3d4e5f607182932
                    client:
                      telefono: '5512345678'
                      fecha_nacimiento: '1995-04-12'
                      sexo: masculino
                properties:
                  message:
                    type: string
                    example: 'Autenticación exitosa.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: TOKEN_DE_EJEMPLO
                  expires_at:
                    type: string
                    example: '2026-11-04T12:00:00.000000Z'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 6710a1b2c3d4e5f607182930
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
                      avatar_url:
                        type: string
                        example: 'https://urbanblade.example/storage/avatars/juan.jpg'
                      roles:
                        type: array
                        example:
                          - cliente
                        items:
                          type: string
                      profile_complete:
                        type: boolean
                        example: true
                      profile_missing:
                        type: array
                        example:
                          - telefono
                        items:
                          type: string
                      client_id:
                        type: string
                        example: 6710a1b2c3d4e5f607182931
                      barber_id:
                        type: string
                        example: 6710a1b2c3d4e5f607182932
                      client:
                        type: object
                        properties:
                          telefono:
                            type: string
                            example: '5512345678'
                          fecha_nacimiento:
                            type: string
                            example: '1995-04-12'
                          sexo:
                            type: string
                            example: masculino
                        required:
                          - telefono
                          - fecha_nacimiento
                          - sexo
                    required:
                      - id
                      - name
                      - email
                      - avatar_url
                      - roles
                      - profile_complete
                      - profile_missing
                      - client_id
                      - barber_id
                      - client
                required:
                  - message
                  - token_type
                  - token
                  - expires_at
                  - user
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Las credenciales no son válidas.'
                properties:
                  message:
                    type: string
                    example: 'Las credenciales no son válidas.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'El correo del usuario.'
                  example: cliente@urbanblade.com
                password:
                  type: string
                  description: 'La contraseña del usuario.'
                  example: password123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo.'
                  example: 'iPhone 15 Pro'
                  nullable: true
                plataforma:
                  type: string
                  description: 'Cliente que inicia sesión: `web` o `movil`. Define cuánto dura el token (config/auth.php: 30 días web, 180 móvil, deslizantes). Si se omite se infiere de device_name.'
                  example: movil
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Registro de Usuario'
      operationId: registroDeUsuario
      description: 'Crea una nueva cuenta de usuario y devuelve el token de acceso inicial.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Registro exitoso.'
                  token_type: Bearer
                  token: 2|xyz...
                  user:
                    id: 5
                    name: 'Nuevo Cliente'
                    role: cliente
                properties:
                  message:
                    type: string
                    example: 'Registro exitoso.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 2|xyz...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Nuevo Cliente'
                      role:
                        type: string
                        example: cliente
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nombre completo.'
                  example: 'Nuevo Cliente'
                email:
                  type: string
                  description: 'Correo único.'
                  example: nuevo@urbanblade.com
                password:
                  type: string
                  description: 'Al menos 8 caracteres.'
                  example: password123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo.'
                  example: 'Android Emulator'
                  nullable: true
                plataforma:
                  type: string
                  description: 'Cliente que se registra: `web` o `movil` (ver login).'
                  example: movil
                  nullable: true
                password_confirmation:
                  type: string
                  description: 'Debe coincidir con password.'
                  example: password123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Recuperar Contraseña (Solicitar Enlace)'
      operationId: recuperarContraseaSolicitarEnlace
      description: 'Envía un enlace de recuperación de contraseña al correo del usuario.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Enlace de recuperación enviado a tu correo.'
                properties:
                  message:
                    type: string
                    example: 'Enlace de recuperación enviado a tu correo.'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No se pudo enviar el enlace de recuperación.'
                properties:
                  message:
                    type: string
                    example: 'No se pudo enviar el enlace de recuperación.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'El correo del usuario registrado.'
                  example: usuario@urbanblade.com
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Restablecer Contraseña'
      operationId: restablecerContrasea
      description: 'Restablece la contraseña del usuario usando el token recibido por correo.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Contraseña restablecida exitosamente.'
                properties:
                  message:
                    type: string
                    example: 'Contraseña restablecida exitosamente.'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token de recuperación inválido.'
                properties:
                  message:
                    type: string
                    example: 'Token de recuperación inválido.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'El token de recuperación recibido por correo.'
                  example: abc123
                email:
                  type: string
                  description: 'El correo del usuario.'
                  example: usuario@urbanblade.com
                password:
                  type: string
                  description: 'Nueva contraseña (mínimo 8 caracteres).'
                  example: nuevaPassword123
                password_confirmation:
                  type: string
                  description: 'Confirmación de la nueva contraseña.'
                  example: nuevaPassword123
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Usuario autenticado'
      operationId: usuarioAutenticado
      description: 'Devuelve los datos del usuario autenticado (según el token Bearer enviado).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 6710a1b2c3d4e5f607182930
                    name: 'Juan Pérez'
                    email: juan@example.com
                    avatar_url: 'https://urbanblade.example/storage/avatars/juan.jpg'
                    roles:
                      - cliente
                    profile_complete: true
                    profile_missing:
                      - telefono
                    client_id: 6710a1b2c3d4e5f607182931
                    barber_id: 6710a1b2c3d4e5f607182932
                    client:
                      telefono: '5512345678'
                      fecha_nacimiento: '1995-04-12'
                      sexo: masculino
                      descuento_activo_pct: 10
                  sesion_con_google: false
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 6710a1b2c3d4e5f607182930
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
                      avatar_url:
                        type: string
                        example: 'https://urbanblade.example/storage/avatars/juan.jpg'
                      roles:
                        type: array
                        example:
                          - cliente
                        items:
                          type: string
                      profile_complete:
                        type: boolean
                        example: true
                      profile_missing:
                        type: array
                        example:
                          - telefono
                        items:
                          type: string
                      client_id:
                        type: string
                        example: 6710a1b2c3d4e5f607182931
                      barber_id:
                        type: string
                        example: 6710a1b2c3d4e5f607182932
                      client:
                        type: object
                        properties:
                          telefono:
                            type: string
                            example: '5512345678'
                          fecha_nacimiento:
                            type: string
                            example: '1995-04-12'
                          sexo:
                            type: string
                            example: masculino
                          descuento_activo_pct:
                            type: integer
                            example: 10
                        required:
                          - telefono
                          - fecha_nacimiento
                          - sexo
                          - descuento_activo_pct
                    required:
                      - id
                      - name
                      - email
                      - avatar_url
                      - roles
                      - profile_complete
                      - profile_missing
                      - client_id
                      - barber_id
                      - client
                  sesion_con_google:
                    type: boolean
                    example: false
                required:
                  - user
                  - sesion_con_google
      tags:
        - Autenticación
  /api/v1/auth/logout:
    post:
      summary: 'Revoca el token móvil actual (el middleware de auth lo deja en request->attributes).'
      operationId: revocaElTokenMvilActualelMiddlewareDeAuthLoDejaEnRequestattributes
      description: ''
      parameters: []
      responses: {}
      tags:
        - Autenticación
      security: []
  /api/v1/auth/refresh-token:
    post:
      summary: 'Renovar Token'
      operationId: renovarToken
      description: 'Revoca el token actual y emite uno nuevo con expiración actualizada.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token renovado exitosamente.'
                  token_type: Bearer
                  token: 3|newtoken...
                  expires_at: '2026-10-11T12:00:00.000000Z'
                  user:
                    id: 1
                    name: 'Juan Pérez'
                    email: juan@example.com
                properties:
                  message:
                    type: string
                    example: 'Token renovado exitosamente.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 3|newtoken...
                  expires_at:
                    type: string
                    example: '2026-10-11T12:00:00.000000Z'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
      tags:
        - Autenticación
      security: []
  /api/v1/auth/get-api-token:
    post:
      summary: 'Obtener Token para Dashboard Web'
      operationId: obtenerTokenParaDashboardWeb
      description: "Genera un token API para usuarios autenticados en el dashboard web.\nPermite que la interfaz web acceda a endpoints que requieren Bearer token."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  message: 'Token generado exitosamente.'
                  token_type: Bearer
                  token: 1|abc123def456...
                  expires_at: '2026-11-10T12:00:00.000000Z'
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Token generado exitosamente.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 1|abc123def456...
                  expires_at:
                    type: string
                    example: '2026-11-10T12:00:00.000000Z'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  message: 'No autenticado.'
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado.'
      tags:
        - Autenticación
  /api/v1/barbershop:
    get:
      summary: "Ficha pública de la barbería: identidad, contacto, horario, política de\ncancelación y redes. Lo consume la landing y la reserva pública, que no\ntienen token."
      operationId: fichaPblicaDeLaBarberaIdentidadContactoHorarioPolticaDeCancelacinYRedesLoConsumeLaLandingYLaReservaPblicaQueNoTienenToken
      description: "Deliberadamente NO usa BarbershopSettingResource: ese recurso incluye\ndatos_bancarios (CLABE, banco, beneficiario) y maintenance_mode, que\nson para el panel de administración, no para un visitante anónimo.\nCualquier campo nuevo que se agregue aquí debe ser seguro de publicar."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    nombre: UrbanBlade
                    logo: null
                    direccion: 'Av. Juárez 120, Centro'
                    telefono: '+52 55 1234 5678'
                    horario_apertura: '09:00'
                    horario_cierre: '21:00'
                    politica_cancelacion: 24
                    redes_sociales:
                      instagram: urbanblade
                      facebook: null
                      tiktok: null
                properties:
                  data:
                    type: object
                    properties:
                      nombre:
                        type: string
                        example: UrbanBlade
                      logo:
                        type: string
                        example: null
                        nullable: true
                      direccion:
                        type: string
                        example: 'Av. Juárez 120, Centro'
                      telefono:
                        type: string
                        example: '+52 55 1234 5678'
                      horario_apertura:
                        type: string
                        example: '09:00'
                      horario_cierre:
                        type: string
                        example: '21:00'
                      politica_cancelacion:
                        type: integer
                        example: 24
                      redes_sociales:
                        type: object
                        properties:
                          instagram:
                            type: string
                            example: urbanblade
                          facebook:
                            type: string
                            example: null
                            nullable: true
                          tiktok:
                            type: string
                            example: null
                            nullable: true
      tags:
        - 'Catálogo público'
      security: []
  /api/v1/appointments:
    get:
      summary: 'Listar Citas'
      operationId: listarCitas
      description: "Obtiene el historial de citas filtrado por el rol del usuario autenticado.\nLos clientes solo ven sus citas, los barberos las suyas, y la administración todas."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Administración, recepción y barbero'
                    type: object
                    example:
                      data:
                        -
                          id: 6710a1b2c3d4e5f607182940
                          code: jfb7ffye
                          fecha: '2026-10-15'
                          hora_inicio: '10:00:00'
                          hora_fin: '10:30:00'
                          estado: confirmada
                          notas: 'Traer foto de referencia.'
                          precio_cobrado: 250
                          propina_sugerida: 25
                          has_payment: false
                          is_chargeable: true
                          pago_resuelto: false
                          puede_iniciar: false
                          motivo_no_iniciar: 'El pago de esta cita aún no está resuelto. Cóbrala en recepción o espera a que se verifique la transferencia antes de iniciar el servicio.'
                          fin_estimado: null
                          minutos_extra: null
                          reminder_24h_sent: false
                          reminder_2h_sent: false
                          deposito_requerido: true
                          deposito_monto: 100
                          deposito_estado: pagado
                          client:
                            id: 6710a1b2c3d4e5f607182931
                            user:
                              name: 'Juan Pérez'
                              avatar_url: 'https://urbanblade.example/storage/avatars/juan.jpg'
                          barber:
                            id: 6710a1b2c3d4e5f607182932
                            slug: carlos-barbero
                            user:
                              name: 'Carlos Barbero'
                            foto_url: 'https://urbanblade.example/storage/barbers/carlos.jpg'
                          service:
                            id: 6710a1b2c3d4e5f607182933
                            nombre: 'Corte Clásico'
                            precio: 250
                            duracion_min: 30
                    properties:
                      data:
                        type: array
                        example:
                          -
                            id: 6710a1b2c3d4e5f607182940
                            code: jfb7ffye
                            fecha: '2026-10-15'
                            hora_inicio: '10:00:00'
                            hora_fin: '10:30:00'
                            estado: confirmada
                            notas: 'Traer foto de referencia.'
                            precio_cobrado: 250
                            propina_sugerida: 25
                            has_payment: false
                            is_chargeable: true
                            pago_resuelto: false
                            puede_iniciar: false
                            motivo_no_iniciar: 'El pago de esta cita aún no está resuelto. Cóbrala en recepción o espera a que se verifique la transferencia antes de iniciar el servicio.'
                            fin_estimado: null
                            minutos_extra: null
                            reminder_24h_sent: false
                            reminder_2h_sent: false
                            deposito_requerido: true
                            deposito_monto: 100
                            deposito_estado: pagado
                            client:
