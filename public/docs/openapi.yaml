    post:
      summary: "Crea un PaymentIntent en Stripe (moneda fija MXN) para que el cliente\npague desde la app; no registra el pago local, eso ocurre vía webhook o store()."
      operationId: creaUnPaymentIntentEnStripemonedaFijaMXNParaQueElClientePagueDesdeLaAppNoRegistraElPagoLocalEsoOcurreVaWebhookOStore
      description: "Autopago del cliente (Fase B del plan Stripe): un cliente autenticado\npuede pagar su PROPIA cita con tarjeta exactamente por el mismo camino\nque usa staff -- el webhook (StripeWebhookController::onSucceeded())\nno distingue quién creó el intent, solo lee metadata.appointment_id y\nllama PaymentService::create() igual en ambos casos. No hace falta\nduplicar lógica de completar el cobro.\n\nEl monto del SERVICIO no se recibe del cliente: se calcula aqui mismo\n(precio base del servicio -> descuento de nivel -> puntos canjeados ->\ngift card) para que lo que Stripe realmente cobra por ese concepto sea\nsiempre el mismo numero que create()/el webhook usaran despues para\nregistrar el pago — nunca se confia en un monto que venga del frontend\npara mover dinero real. La propina SI es una eleccion del cliente (no\nhay \"precio correcto\" que releer), se valida como numero >= 0 y se\nsuma aparte al total que ve Stripe; PaymentService::create() la guarda\nen su propio campo, nunca se mezcla con precio_cobrado."
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointment_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                puntos_canjeados:
                  type: integer
                  description: 'El campo value debe ser al menos 0.'
                  example: 39
                  nullable: true
                codigo_gift_card:
                  type: string
                  description: 'El campo value no debe tener más de 20 caracteres.'
                  example: gzmiyvdljnikhway
                  nullable: true
                propina:
                  type: number
                  description: 'El campo value debe ser al menos 0.'
                  example: 62
                  nullable: true
                guardar_tarjeta:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                tarjeta_guardada:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
              required:
                - appointment_id
      security: []
