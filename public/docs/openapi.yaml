openapi: 3.0.3
info:
  title: 'UrbanBlade API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Autenticación
    description: "\nEndpoints para el manejo de sesiones de usuario (token Bearer propio,\ntabla mobile_api_tokens — no Sanctum)."
  -
    name: Citas
    description: "\nGestión de citas para clientes, barberos y administración."
  -
    name: Endpoints
    description: ''
  -
    name: 'Gestión de Chatbot'
    description: "\nEndpoints para gestionar el chatbot (historial, perfil, estadísticas)."
  -
    name: 'Gestión de Perfil'
    description: "\nEndpoints para gestionar el perfil del usuario autenticado."
  -
    name: 'Horarios de Barbero'
    description: "\nEndpoints para gestionar los horarios del barbero."
  -
    name: Inventario
    description: "\nGestión de productos, stock y movimientos de almacén."
  -
    name: 'Portafolio de Barbero'
    description: "\nEndpoints para gestionar el portafolio de trabajos del barbero."
paths:
  /api/v1/auth/login:
    post:
      summary: 'Iniciar Sesión'
      operationId: iniciarSesin
      description: 'Autentica al usuario y devuelve un token de acceso para la API móvil.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Autenticación exitosa.'
                  token_type: Bearer
                  token: 1|abc123def456...
                  user:
                    id: 1
                    name: 'Juan Pérez'
                    email: juan@example.com
                    role: cliente
                properties:
                  message:
                    type: string
                    example: 'Autenticación exitosa.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 1|abc123def456...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
                      role:
                        type: string
                        example: cliente
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Las credenciales no son válidas.'
                properties:
                  message:
                    type: string
                    example: 'Las credenciales no son válidas.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'El correo del usuario.'
                  example: cliente@urbanblade.com
                password:
                  type: string
                  description: 'La contraseña del usuario.'
                  example: password123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo.'
                  example: 'iPhone 15 Pro'
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Registro de Usuario'
      operationId: registroDeUsuario
      description: 'Crea una nueva cuenta de usuario y devuelve el token de acceso inicial.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Registro exitoso.'
                  token_type: Bearer
                  token: 2|xyz...
                  user:
                    id: 5
                    name: 'Nuevo Cliente'
                    role: cliente
                properties:
                  message:
                    type: string
                    example: 'Registro exitoso.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 2|xyz...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Nuevo Cliente'
                      role:
                        type: string
                        example: cliente
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nombre completo.'
                  example: 'Nuevo Cliente'
                email:
                  type: string
                  description: 'Correo único.'
                  example: nuevo@urbanblade.com
                password:
                  type: string
                  description: 'Al menos 8 caracteres.'
                  example: password123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo.'
                  example: 'Android Emulator'
                  nullable: true
                password_confirmation:
                  type: string
                  description: 'Debe coincidir con password.'
                  example: password123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Recuperar Contraseña (Solicitar Enlace)'
      operationId: recuperarContraseaSolicitarEnlace
      description: 'Envía un enlace de recuperación de contraseña al correo del usuario.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Enlace de recuperación enviado a tu correo.'
                properties:
                  message:
                    type: string
                    example: 'Enlace de recuperación enviado a tu correo.'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No se pudo enviar el enlace de recuperación.'
                properties:
                  message:
                    type: string
                    example: 'No se pudo enviar el enlace de recuperación.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'El correo del usuario registrado.'
                  example: usuario@urbanblade.com
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Restablecer Contraseña'
      operationId: restablecerContrasea
      description: 'Restablece la contraseña del usuario usando el token recibido por correo.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Contraseña restablecida exitosamente.'
                properties:
                  message:
                    type: string
                    example: 'Contraseña restablecida exitosamente.'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token de recuperación inválido.'
                properties:
                  message:
                    type: string
                    example: 'Token de recuperación inválido.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'El token de recuperación recibido por correo.'
                  example: abc123
                email:
                  type: string
                  description: 'El correo del usuario.'
                  example: usuario@urbanblade.com
                password:
                  type: string
                  description: 'Nueva contraseña (mínimo 8 caracteres).'
                  example: nuevaPassword123
                password_confirmation:
                  type: string
                  description: 'Confirmación de la nueva contraseña.'
                  example: nuevaPassword123
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Devuelve los datos del usuario autenticado (según el token Bearer enviado).'
      operationId: devuelveLosDatosDelUsuarioAutenticadosegnElTokenBearerEnviado
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado.'
      tags:
        - Autenticación
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Revoca el token móvil actual (el middleware de auth lo deja en request->attributes).'
      operationId: revocaElTokenMvilActualelMiddlewareDeAuthLoDejaEnRequestattributes
      description: ''
      parameters: []
      responses: {}
      tags:
        - Autenticación
      security: []
  /api/v1/auth/refresh-token:
    post:
      summary: 'Renovar Token'
      operationId: renovarToken
      description: 'Revoca el token actual y emite uno nuevo con expiración actualizada.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token renovado exitosamente.'
                  token_type: Bearer
                  token: 3|newtoken...
                  expires_at: '2026-10-11T12:00:00.000000Z'
                  user:
                    id: 1
                    name: 'Juan Pérez'
                    email: juan@example.com
                properties:
                  message:
                    type: string
                    example: 'Token renovado exitosamente.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 3|newtoken...
                  expires_at:
                    type: string
                    example: '2026-10-11T12:00:00.000000Z'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
      tags:
        - Autenticación
      security: []
  /api/v1/auth/get-api-token:
    post:
      summary: 'Obtener Token para Dashboard Web'
      operationId: obtenerTokenParaDashboardWeb
      description: "Genera un token API para usuarios autenticados en el dashboard web.\nPermite que la interfaz web acceda a endpoints que requieren Bearer token."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  message: 'Token generado exitosamente.'
                  token_type: Bearer
                  token: 1|abc123def456...
                  expires_at: '2026-11-10T12:00:00.000000Z'
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Token generado exitosamente.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 1|abc123def456...
                  expires_at:
                    type: string
                    example: '2026-11-10T12:00:00.000000Z'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  message: 'No autenticado.'
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado.'
      tags:
        - Autenticación
  /api/v1/appointments:
    get:
      summary: 'Listar Citas'
      operationId: listarCitas
      description: "Obtiene el historial de citas filtrado por el rol del usuario autenticado.\nLos clientes solo ven sus citas, los barberos las suyas, y la administración todas."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      client_id: 10
                      barber_id: 2
                      service_id: 5
                      fecha: '2026-04-15'
                      hora_inicio: '10:00:00'
                      hora_fin: '11:00:00'
                      estado: confirmada
                      notas: 'Corte de cabello degradado.'
                      client_name: 'Juan Pérez'
                      barber_name: 'Carlos Barbero'
                      service_name: 'Corte Clásico'
                      service_duration: 60
                      created_at: '2026-04-10T15:00:00Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        client_id: 10
                        barber_id: 2
                        service_id: 5
                        fecha: '2026-04-15'
                        hora_inicio: '10:00:00'
                        hora_fin: '11:00:00'
                        estado: confirmada
                        notas: 'Corte de cabello degradado.'
                        client_name: 'Juan Pérez'
                        barber_name: 'Carlos Barbero'
                        service_name: 'Corte Clásico'
                        service_duration: 60
                        created_at: '2026-04-10T15:00:00Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        client_id:
                          type: integer
                          example: 10
                        barber_id:
                          type: integer
                          example: 2
                        service_id:
                          type: integer
                          example: 5
                        fecha:
                          type: string
                          example: '2026-04-15'
                        hora_inicio:
                          type: string
                          example: '10:00:00'
                        hora_fin:
                          type: string
                          example: '11:00:00'
                        estado:
                          type: string
                          example: confirmada
                        notas:
                          type: string
                          example: 'Corte de cabello degradado.'
                        client_name:
                          type: string
                          example: 'Juan Pérez'
                        barber_name:
                          type: string
                          example: 'Carlos Barbero'
                        service_name:
                          type: string
                          example: 'Corte Clásico'
                        service_duration:
                          type: integer
                          example: 60
                        created_at:
                          type: string
                          example: '2026-04-10T15:00:00Z'
      tags:
        - Citas
    post:
      summary: 'Crear Cita'
      operationId: crearCita
      description: 'Registra una nueva cita en el sistema validando la disponibilidad del barbero.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n \"message\": \"Cita creada correctamente.\",\n \"data\": { \"id\": 1, \"estado\": \"confirmada\", ... }\n}"
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado para crear citas.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado para crear citas.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'El barbero ya tiene una cita en ese horario.'
                properties:
                  message:
                    type: string
                    example: 'El barbero ya tiene una cita en ese horario.'
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barber_id:
                  type: integer
                  description: 'El ID del barbero.'
                  example: 2
                service_id:
                  type: integer
                  description: 'El ID del servicio.'
                  example: 5
                fecha:
                  type: date
                  description: 'La fecha de la cita (YYYY-MM-DD).'
                  example: '2026-04-15'
                hora_inicio:
                  type: string
                  description: 'La hora de inicio (HH:mm).'
                  example: '10:00'
                notas:
                  type: string
                  description: 'Opcional. Notas adicionales.'
                  example: 'Traer foto de referencia.'
                  nullable: true
                client_id:
                  type: integer
                  description: 'Requerido solo para Admin/Recepcionista. ID del cliente.'
                  example: 10
                estado:
                  type: string
                  description: 'Requerido solo para Admin/Recepcionista. Uno de: pendiente, confirmada, en_proceso, completada, cancelada, no_asistio.'
                  example: confirmada
              required:
                - barber_id
                - service_id
                - fecha
                - hora_inicio
  /api/v1/appointments/calendar-data:
    get:
      summary: "Citas del rango de fechas (y barbero opcional) como eventos de\nFullCalendar — puerto directo de\nAppointment\\AppointmentController::calendarData() (web), para el\ncalendario del frontend Nuxt (ver\nfrontend-urban/.claude/skills/nuxt-migration-plan/SKILL.md, Fase 7)."
      operationId: citasDelRangoDeFechasyBarberoOpcionalComoEventosDeFullCalendarPuertoDirectoDeAppointmentAppointmentControllercalendarDatawebParaElCalendarioDelFrontendNuxtverFrontendUrbanclaudeskillsnuxtMigrationPlanSKILLmdFase7
      description: "Esa versión web solo es alcanzable con sesión + permiso\n'citas.gestionar'; aquí se restringe por rol vía token Bearer,\nmismo criterio de admin/recepcionista."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado.'
      tags:
        - Citas
      security: []
  /api/v1/appointments/chargeable:
    get:
      summary: "Citas cobrables (aprobadas por el barbero, sin pago aun) para el\nselector de \"Nuevo Cobro\" — puerto directo de la consulta que usa\nPayment\\PaymentController::create() (web), mas los datos de\nlealtad/premio de rifa del cliente que esa vista precalcula para el\npreview de descuento. El monto real cobrado NUNCA se calcula aqui:\nesto es solo para que el staff vea el precio base y el descuento\npotencial antes de cobrar; PaymentService::create() vuelve a leer\ntodo del lado servidor al procesar el pago (ver guardrail #13)."
      operationId: 
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado.'
      tags:
        - Citas
      security: []
  '/api/v1/appointments/{appointment_code}':
    put:
      summary: "Edita una cita completa (todos los campos). Reservado a administración/recepción;\nel barbero solo puede cambiar el estado vía updateStatus()."
      operationId: editaUnaCitaCompletatodosLosCamposReservadoAAdministracinrecepcinElBarberoSoloPuedeCambiarElEstadoVaUpdateStatus
      description: ''
      parameters: []
      responses: {}
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                barber_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                service_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                fecha:
                  type: string
                  description: 'El campo value no es una fecha válida. El campo value debe ser una fecha posterior o igual a <code>today</code>.'
                  example: '2052-09-29'
                hora_inicio:
                  type: string
                  description: 'Must be a valid date in the format <code>H:i</code>.'
                  example: '11:18'
                estado:
                  type: string
                  description: ''
                  example: completada
                  enum:
                    - pendiente
                    - confirmada
                    - en_proceso
                    - completada
                    - cancelada
                    - no_asistio
                notas:
                  type: string
                  description: 'El campo value no debe tener más de 1000 caracteres.'
                  example: 'n'
                  nullable: true
              required:
                - client_id
                - barber_id
                - service_id
                - fecha
                - hora_inicio
                - estado
      security: []
    delete:
      summary: 'Cancela una cita (soft-cancel: cambia estado a "cancelada", no elimina el registro).'
      operationId: cancelaUnaCitasoftCancelCambiaEstadoAcanceladaNoEliminaElRegistro
      description: 'Permitido al cliente dueño de la cita o a un administrador.'
      parameters: []
      responses: {}
      tags:
        - Citas
      security: []
    parameters:
      -
        in: path
        name: appointment_code
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/appointments/{appointment_code}/status':
    patch:
      summary: "Permite al barbero dueño de la cita cambiar su estado (respetando la máquina de estados\nvalidada en AppointmentStatusService)."
      operationId: permiteAlBarberoDueoDeLaCitaCambiarSuEstadorespetandoLaMquinaDeEstadosValidadaEnAppointmentStatusService
      description: ''
      parameters: []
      responses: {}
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  description: ''
                  example: cancelada
                  enum:
                    - pendiente
                    - confirmada
                    - en_proceso
                    - completada
                    - cancelada
                    - no_asistio
                notas:
                  type: string
                  description: 'El campo value no debe tener más de 1000 caracteres.'
                  example: b
                  nullable: true
              required:
                - estado
      security: []
    parameters:
      -
        in: path
        name: appointment_code
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/barber/agenda:
    get:
      summary: "Agenda propia del barbero autenticado, con el mismo periodo, filtro y\nestadisticas que la vista web de Mi Agenda."
      operationId: agendaPropiaDelBarberoAutenticadoConElMismoPeriodoFiltroYEstadisticasQueLaVistaWebDeMiAgenda
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado.'
      tags:
        - Citas
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                  description: ''
                  example: day
                  enum:
                    - day
                    - week
                estado:
                  type: string
                  description: ''
                  example: completada
                  enum:
                    - pendiente
                    - confirmada
                    - en_proceso
                    - completada
                    - cancelada
                    - no_asistio
                  nullable: true
                offset:
                  type: integer
                  description: 'El campo value debe estar entre -365 y 365.'
                  example: -364
      security: []
  /api/stripe/webhook:
    post:
      summary: 'Punto de entrada del webhook: valida la firma de Stripe y despacha según el tipo de evento.'
      operationId: puntoDeEntradaDelWebhookValidaLaFirmaDeStripeYDespachaSegnElTipoDeEvento
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/availability/slots:
    get:
      summary: 'Calcula los horarios libres de un barbero en una fecha dada, según la duración del servicio elegido.'
      operationId: calculaLosHorariosLibresDeUnBarberoEnUnaFechaDadaSegnLaDuracinDelServicioElegido
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'El barber id seleccionado no es válido. (and 1 more error)'
                  errors:
                    barber_id:
                      - 'El barber id seleccionado no es válido.'
                    service_id:
                      - 'El service id seleccionado no es válido.'
                properties:
                  message:
                    type: string
                    example: 'El barber id seleccionado no es válido. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      barber_id:
                        type: array
                        example:
                          - 'El barber id seleccionado no es válido.'
                        items:
                          type: string
                      service_id:
                        type: array
                        example:
                          - 'El service id seleccionado no es válido.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barber_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                service_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                date:
                  type: string
