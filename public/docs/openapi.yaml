          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'validation.exists (and 1 more error)'
                  errors:
                    barber_id:
                      - validation.exists
                    service_id:
                      - validation.exists
                properties:
                  message:
                    type: string
                    example: 'validation.exists (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      barber_id:
                        type: array
                        example:
                          - validation.exists
                        items:
                          type: string
                      service_id:
                        type: array
                        example:
                          - validation.exists
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barber_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the barbers table.'
                  example: architecto
                service_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the services table.'
                  example: architecto
                date:
                  type: string
                  description: 'validation.date validation.after_or_equal.'
                  example: '2052-05-03'
              required:
