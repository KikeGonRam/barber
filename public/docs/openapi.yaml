  /api/v1/auth/google/callback:
    get:
      summary: "Google redirige aquí con el código de autorización. Busca o crea el\nusuario por email (mismo camino de asignación de rol que\nAuthController::register() -- siempre 'cliente', nunca algo elegido por\nel propio flujo de OAuth), emite un token, y manda al usuario de vuelta\nal destino indicado por `state` (frontend del cliente, o spark) con el\ntoken en la URL -- mismo patrón que ResetPassword::createUrlUsing()\nusa frontend_url. spark hace su propia verificación de rol\n(administrador/ingeniero) llamando a GET /api/v1/auth/me con este\ntoken -- este controlador no filtra por rol, solo acredita identidad."
      operationId: 
      description: ''
      parameters: []
      responses:
        302:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "<!DOCTYPE html>\n<html>\n    <head>\n        <meta charset=\"UTF-8\" />\n        <meta http-equiv=\"refresh\" content=\"0;url='http://localhost:3000/login?error=google_failed'\" />\n\n        <title>Redirecting to http://localhost:3000/login?error=google_failed</title>\n    </head>\n    <body>\n        Redirecting to <a href=\"http://localhost:3000/login?error=google_failed\">http://localhost:3000/login?error=google_failed</a>.\n    </body>\n</html>"
      tags:
        - Endpoints
      security: []
  /api/v1/auth/google/token:
    post:
      summary: 'Login con Google Nativo (Android)'
      operationId: loginConGoogleNativoAndroid
      description: "Verifica un ID token emitido por Google Identity Services / Credential\nManager directamente (sin pasar por el navegador ni el flujo\nauthorization-code de redirect()/callback() de arriba) y emite el\nmismo Bearer token que el resto de la API. Pensado para la app Android\nnativa: Credential Manager entrega un ID token firmado por Google, no\nun código de autorización, así que no puede reusar Socialite."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Autenticación exitosa.'
                  token_type: Bearer
                  token: 1|abc123def456...
                  user:
                    id: 1
                    name: 'Juan Pérez'
                    email: juan@example.com
                properties:
                  message:
                    type: string
                    example: 'Autenticación exitosa.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 1|abc123def456...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'El token de Google no es válido.'
                properties:
                  message:
                    type: string
                    example: 'El token de Google no es válido.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: 'El ID token emitido por Google Identity Services.'
                  example: eyJhbGciOiJSUzI1NiIs...
              required:
                - id_token
      security: []
