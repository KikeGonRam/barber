openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Autenticación
    description: "\nEndpoints para el manejo de sesiones de usuario (Sanctum/Mobile API)."
  -
    name: Citas
    description: "\nGestión de citas para clientes, barberos y administración."
  -
    name: Endpoints
    description: ''
  -
    name: 'Gestión de Chatbot'
    description: "\nEndpoints para gestionar el chatbot (historial, perfil, estadísticas)."
  -
    name: 'Gestión de Perfil'
    description: "\nEndpoints para gestionar el perfil del usuario autenticado."
  -
    name: 'Horarios de Barbero'
    description: "\nEndpoints para gestionar los horarios del barbero."
  -
    name: Inventario
    description: "\nGestión de productos, stock y movimientos de almacén."
  -
    name: 'Portafolio de Barbero'
    description: "\nEndpoints para gestionar el portafolio de trabajos del barbero."
paths:
  /api/v1/auth/login:
    post:
      summary: 'Iniciar Sesión'
      operationId: iniciarSesin
      description: 'Autentica al usuario y devuelve un token de acceso para la API móvil.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Autenticación exitosa.'
                  token_type: Bearer
                  token: 1|abc123def456...
                  user:
                    id: 1
                    name: 'Juan Pérez'
                    email: juan@example.com
                    role: cliente
                properties:
                  message:
                    type: string
                    example: 'Autenticación exitosa.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 1|abc123def456...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
                      role:
                        type: string
                        example: cliente
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Las credenciales no son válidas.'
                properties:
                  message:
                    type: string
                    example: 'Las credenciales no son válidas.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'El correo del usuario.'
                  example: cliente@urbanblade.com
                password:
                  type: string
                  description: 'La contraseña del usuario.'
                  example: password123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo.'
                  example: 'iPhone 15 Pro'
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Registro de Usuario'
      operationId: registroDeUsuario
      description: 'Crea una nueva cuenta de usuario y devuelve el token de acceso inicial.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Registro exitoso.'
                  token_type: Bearer
                  token: 2|xyz...
                  user:
                    id: 5
                    name: 'Nuevo Cliente'
                    role: cliente
                properties:
                  message:
                    type: string
                    example: 'Registro exitoso.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 2|xyz...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Nuevo Cliente'
                      role:
                        type: string
                        example: cliente
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nombre completo.'
                  example: 'Nuevo Cliente'
                email:
                  type: string
                  description: 'Correo único.'
                  example: nuevo@urbanblade.com
                password:
                  type: string
                  description: 'Al menos 8 caracteres.'
                  example: password123
                device_name:
                  type: string
                  description: 'Nombre del dispositivo.'
                  example: 'Android Emulator'
                  nullable: true
                password_confirmation:
                  type: string
                  description: 'Debe coincidir con password.'
                  example: password123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Recuperar Contraseña (Solicitar Enlace)'
      operationId: recuperarContraseaSolicitarEnlace
      description: 'Envía un enlace de recuperación de contraseña al correo del usuario.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Enlace de recuperación enviado a tu correo.'
                properties:
                  message:
                    type: string
                    example: 'Enlace de recuperación enviado a tu correo.'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No se pudo enviar el enlace de recuperación.'
                properties:
                  message:
                    type: string
                    example: 'No se pudo enviar el enlace de recuperación.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'El correo del usuario registrado.'
                  example: usuario@urbanblade.com
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Restablecer Contraseña'
      operationId: restablecerContrasea
      description: 'Restablece la contraseña del usuario usando el token recibido por correo.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Contraseña restablecida exitosamente.'
                properties:
                  message:
                    type: string
                    example: 'Contraseña restablecida exitosamente.'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token de recuperación inválido.'
                properties:
                  message:
                    type: string
                    example: 'Token de recuperación inválido.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'El token de recuperación recibido por correo.'
                  example: abc123
                email:
                  type: string
                  description: 'El correo del usuario.'
                  example: usuario@urbanblade.com
                password:
                  type: string
                  description: 'Nueva contraseña (mínimo 8 caracteres).'
                  example: nuevaPassword123
                password_confirmation:
                  type: string
                  description: 'Confirmación de la nueva contraseña.'
                  example: nuevaPassword123
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/me:
    get:
      summary: ''
      operationId: getApiV1AuthMe
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado.'
      tags:
        - Autenticación
      security: []
  /api/v1/auth/logout:
    post:
      summary: ''
      operationId: postApiV1AuthLogout
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autenticación
      security: []
  /api/v1/auth/refresh-token:
    post:
      summary: 'Renovar Token'
      operationId: renovarToken
      description: 'Revoca el token actual y emite uno nuevo con expiración actualizada.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token renovado exitosamente.'
                  token_type: Bearer
                  token: 3|newtoken...
                  expires_at: '2026-10-11T12:00:00.000000Z'
                  user:
                    id: 1
                    name: 'Juan Pérez'
                    email: juan@example.com
                properties:
                  message:
                    type: string
                    example: 'Token renovado exitosamente.'
                  token_type:
                    type: string
                    example: Bearer
                  token:
                    type: string
                    example: 3|newtoken...
                  expires_at:
                    type: string
                    example: '2026-10-11T12:00:00.000000Z'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Juan Pérez'
                      email:
                        type: string
                        example: juan@example.com
      tags:
        - Autenticación
      security: []
  /api/v1/appointments:
    get:
      summary: 'Listar Citas'
      operationId: listarCitas
      description: "Obtiene el historial de citas filtrado por el rol del usuario autenticado.\nLos clientes solo ven sus citas, los barberos las suyas, y la administración todas."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      client_id: 10
                      barber_id: 2
                      service_id: 5
                      fecha: '2026-04-15'
                      hora_inicio: '10:00:00'
                      hora_fin: '11:00:00'
                      estado: confirmada
                      notas: 'Corte de cabello degradado.'
                      client_name: 'Juan Pérez'
                      barber_name: 'Carlos Barbero'
                      service_name: 'Corte Clásico'
                      service_duration: 60
                      created_at: '2026-04-10T15:00:00Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        client_id: 10
                        barber_id: 2
                        service_id: 5
                        fecha: '2026-04-15'
                        hora_inicio: '10:00:00'
                        hora_fin: '11:00:00'
                        estado: confirmada
                        notas: 'Corte de cabello degradado.'
                        client_name: 'Juan Pérez'
                        barber_name: 'Carlos Barbero'
                        service_name: 'Corte Clásico'
                        service_duration: 60
                        created_at: '2026-04-10T15:00:00Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        client_id:
                          type: integer
                          example: 10
                        barber_id:
                          type: integer
                          example: 2
                        service_id:
                          type: integer
                          example: 5
                        fecha:
                          type: string
                          example: '2026-04-15'
                        hora_inicio:
                          type: string
                          example: '10:00:00'
                        hora_fin:
                          type: string
                          example: '11:00:00'
                        estado:
                          type: string
                          example: confirmada
                        notas:
                          type: string
                          example: 'Corte de cabello degradado.'
                        client_name:
                          type: string
                          example: 'Juan Pérez'
                        barber_name:
                          type: string
                          example: 'Carlos Barbero'
                        service_name:
                          type: string
                          example: 'Corte Clásico'
                        service_duration:
                          type: integer
                          example: 60
                        created_at:
                          type: string
                          example: '2026-04-10T15:00:00Z'
      tags:
        - Citas
    post:
      summary: 'Crear Cita'
      operationId: crearCita
      description: 'Registra una nueva cita en el sistema validando la disponibilidad del barbero.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n \"message\": \"Cita creada correctamente.\",\n \"data\": { \"id\": 1, \"estado\": \"confirmada\", ... }\n}"
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No autorizado para crear citas.'
                properties:
                  message:
                    type: string
                    example: 'No autorizado para crear citas.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'El barbero ya tiene una cita en ese horario.'
                properties:
                  message:
                    type: string
                    example: 'El barbero ya tiene una cita en ese horario.'
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barber_id:
                  type: integer
                  description: 'El ID del barbero.'
                  example: 2
                service_id:
                  type: integer
                  description: 'El ID del servicio.'
                  example: 5
                fecha:
                  type: date
                  description: 'La fecha de la cita (YYYY-MM-DD).'
                  example: '2026-04-15'
                hora_inicio:
                  type: string
                  description: 'La hora de inicio (HH:mm).'
                  example: '10:00'
                notas:
                  type: string
                  description: 'Opcional. Notas adicionales.'
                  example: 'Traer foto de referencia.'
                  nullable: true
                client_id:
                  type: integer
                  description: 'Requerido solo para Admin/Recepcionista. ID del cliente.'
                  example: 10
                estado:
                  type: string
                  description: 'Requerido solo para Admin/Recepcionista. Uno de: pendiente, confirmada, en_proceso, completada, cancelada, no_asistio.'
                  example: confirmada
              required:
                - barber_id
                - service_id
                - fecha
                - hora_inicio
  '/api/v1/appointments/{appointment_id}':
    put:
      summary: ''
      operationId: putApiV1AppointmentsAppointment_id
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the clients table.'
                  example: architecto
                barber_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the barbers table.'
                  example: architecto
                service_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the services table.'
                  example: architecto
                fecha:
                  type: string
                  description: 'validation.date validation.after_or_equal.'
                  example: '2052-05-31'
                hora_inicio:
                  type: string
                  description: 'Must be a valid date in the format <code>H:i</code>.'
                  example: '22:53'
                estado:
                  type: string
                  description: ''
                  example: confirmada
                  enum:
                    - pendiente
                    - confirmada
                    - en_proceso
                    - completada
                    - cancelada
                    - no_asistio
                notas:
                  type: string
                  description: validation.max.
                  example: 'n'
                  nullable: true
              required:
                - client_id
                - barber_id
                - service_id
                - fecha
                - hora_inicio
                - estado
      security: []
    delete:
      summary: ''
      operationId: deleteApiV1AppointmentsAppointment_id
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Citas
      security: []
    parameters:
      -
        in: path
        name: appointment_id
        description: 'The ID of the appointment.'
        example: 8
        required: true
        schema:
          type: integer
  '/api/v1/appointments/{appointment_id}/status':
    patch:
      summary: ''
      operationId: patchApiV1AppointmentsAppointment_idStatus
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  description: ''
                  example: confirmada
                  enum:
                    - pendiente
                    - confirmada
                    - en_proceso
                    - completada
                    - cancelada
                    - no_asistio
                notas:
                  type: string
                  description: validation.max.
                  example: b
                  nullable: true
              required:
                - estado
      security: []
    parameters:
      -
        in: path
        name: appointment_id
        description: 'The ID of the appointment.'
        example: 8
        required: true
        schema:
          type: integer
  /api/availability/slots:
    get:
      summary: ''
      operationId: getApiAvailabilitySlots
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'validation.exists (and 1 more error)'
                  errors:
                    barber_id:
                      - validation.exists
                    service_id:
                      - validation.exists
                properties:
                  message:
                    type: string
                    example: 'validation.exists (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      barber_id:
                        type: array
                        example:
                          - validation.exists
                        items:
                          type: string
                      service_id:
                        type: array
                        example:
                          - validation.exists
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barber_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the barbers table.'
                  example: architecto
                service_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the services table.'
                  example: architecto
                date:
                  type: string
                  description: 'validation.date validation.after_or_equal.'
                  example: '2052-05-31'
              required:
                - barber_id
                - service_id
                - date
      security: []
  /api/v1/services:
    get:
      summary: ''
      operationId: getApiV1Services
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 9
                      nombre: 'TEST DER SERVICE'
                      categoria: BAHB
                      precio: '120.00'
                      duracion_min: 159
                      imagen: null
                      descripcion: 'TETVSG B'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 9
                        nombre: 'TEST DER SERVICE'
                        categoria: BAHB
                        precio: '120.00'
                        duracion_min: 159
                        imagen: null
                        descripcion: 'TETVSG B'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 9
                        nombre:
                          type: string
                          example: 'TEST DER SERVICE'
                        categoria:
                          type: string
                          example: BAHB
                        precio:
                          type: string
                          example: '120.00'
                        duracion_min:
                          type: integer
                          example: 159
                        imagen:
                          type: string
                          example: null
                          nullable: true
                        descripcion:
                          type: string
                          example: 'TETVSG B'
      tags:
        - Endpoints
      security: []
  /api/v1/barbers:
    get:
      summary: ''
      operationId: getApiV1Barbers
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 9
                      name: 'Barbero Test'
                      especialidades: 'Fade, Barba'
                      foto: barbers/29/15/04/2026/cddcbff9-42ec-4209-bc8b-d724fd474b83.png
                      descripcion: 'Barbero de pruebas automatizadas'
                    -
                      id: 10
                      name: 'Barbero Test 1'
                      especialidades: 'Corte clásico'
                      foto: null
                      descripcion: 'Barbero de pruebas 1'
                    -
                      id: 11
                      name: 'Barbero Test 2'
                      especialidades: 'Corte clásico'
                      foto: null
                      descripcion: 'Barbero de pruebas 2'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 9
                        name: 'Barbero Test'
                        especialidades: 'Fade, Barba'
                        foto: barbers/29/15/04/2026/cddcbff9-42ec-4209-bc8b-d724fd474b83.png
                        descripcion: 'Barbero de pruebas automatizadas'
                      -
                        id: 10
                        name: 'Barbero Test 1'
                        especialidades: 'Corte clásico'
                        foto: null
                        descripcion: 'Barbero de pruebas 1'
                      -
                        id: 11
                        name: 'Barbero Test 2'
                        especialidades: 'Corte clásico'
                        foto: null
                        descripcion: 'Barbero de pruebas 2'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 9
                        name:
                          type: string
                          example: 'Barbero Test'
                        especialidades:
                          type: string
                          example: 'Fade, Barba'
                        foto:
                          type: string
                          example: barbers/29/15/04/2026/cddcbff9-42ec-4209-bc8b-d724fd474b83.png
                        descripcion:
                          type: string
                          example: 'Barbero de pruebas automatizadas'
      tags:
        - Endpoints
      security: []
  /api/v1/availability/slots:
    get:
      summary: ''
      operationId: getApiV1AvailabilitySlots
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'validation.exists (and 1 more error)'
                  errors:
                    barber_id:
                      - validation.exists
                    service_id:
                      - validation.exists
                properties:
                  message:
                    type: string
                    example: 'validation.exists (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      barber_id:
                        type: array
                        example:
                          - validation.exists
                        items:
                          type: string
                      service_id:
                        type: array
                        example:
                          - validation.exists
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barber_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the barbers table.'
                  example: architecto
                service_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the services table.'
                  example: architecto
                date:
                  type: string
                  description: 'validation.date validation.after_or_equal.'
                  example: '2052-05-31'
              required:
                - barber_id
                - service_id
                - date
      security: []
  /api/v1/social/feed:
    get:
      summary: ''
      operationId: getApiV1SocialFeed
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      title: TETS
                      description: YGBGTFVGB
                      work_date: null
                      barber:
                        id: 29
                        name: 'Barbero Test'
                      images:
                        - portfolio/aY4tLlvTSMbsTWZjiKi7VwhzSqq7KVwTvmelfcST.png
                      reactions_count: 2
                      comments_count: 0
                      saved_count: 0
                      is_reacted: false
                      is_saved: false
                  meta:
                    current_page: 1
                    last_page: 1
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
