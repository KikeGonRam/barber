[PHP]
; Limite acotado en vez de 0 (ilimitado): el portafolio de barbero acepta
; hasta 10 archivos por request (imagen o video), post_max_size cubre eso
; con margen sin dejar el endpoint abierto a un POST de tamano arbitrario.
post_max_size = 200M
upload_max_filesize = 50M
variables_order = EGPCS
memory_limit = 512M

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.save_comments=1
opcache.fast_shutdown=1
; revalidate_freq/validate_timestamps en modo dev (bind mount + hot reload):
; con 0 el codigo cambiado en el host no se refleja hasta reiniciar el
; contenedor (nos paso en vivo). 2s de chequeo es imperceptible en dev y
; evita ese reinicio manual. Para una imagen de produccion inmutable,
; volver a poner ambos en 0.
opcache.revalidate_freq=2
opcache.validate_timestamps=1
