; php.ini de la imagen de STAGING/PRODUCCION (.docker/staging/Dockerfile).
; Igual que .docker/php/php.ini (desarrollo) salvo OPcache: aqui el codigo vive
; dentro de la imagen y no cambia mientras el contenedor corre, asi que no hace
; falta revisar la fecha de cada archivo en cada peticion.
[PHP]
post_max_size = 200M
upload_max_filesize = 50M
variables_order = EGPCS
memory_limit = 512M
; TT11 (HT-04): no enviar "X-Powered-By: PHP/8.x".
expose_php = Off

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.save_comments=1
opcache.fast_shutdown=1
; Imagen inmutable: nunca revalidar. Un cambio de codigo llega con una imagen
; nueva, es decir, con un proceso PHP-FPM nuevo y la cache de OPcache vacia.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
