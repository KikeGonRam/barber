# TT10 (HT-04): CSP en tres niveles. Mismo valor que el Caddyfile.
#  1. /api/*: solo JSON, no permite cargar nada.
#  2. /docs y /pulse (Scribe y Pulse): necesitan scripts inline y sus CDN; es el único
#     lugar donde se permite 'unsafe-inline'/'unsafe-eval'.
#  3. Resto (páginas de error, mantenimiento, auth): sin 'unsafe-inline' ni 'unsafe-eval' en
#     scripts. El único script inline (components/error-page.blade.php) va por hash SHA-256;
#     si se edita ese script hay que recalcular el hash en este archivo y en el Caddyfile.
#  Se mapea $request_uri y no $uri: try_files reescribe $uri a /index.php para todo lo que
#  pasa por Laravel, y entonces ninguna regla por prefijo (/api/, /pulse) llegaba a aplicar.
map $request_uri $urbanblade_csp {
    ~^/api/ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    ~^/(docs|pulse)(/|\?|$) "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.bunny.net https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
    default "default-src 'self'; script-src 'self' 'sha256-N4q8E5h0EnfC0Sg5i9ybKS/9uzcjdJ/oc8HTng1ZujA='; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    # TT11 (HT-04): sin versión de nginx en la cabecera Server ni en las páginas de error.
    server_tokens off;
    index index.php index.html;
    root /var/www/html/public;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $urbanblade_csp always;
    # En local (http) el navegador ignora HSTS; se deja igual que en staging para que no diverjan.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Use Docker's embedded DNS so nginx re-resolves 'app' on each request.
    # Without this nginx caches the resolved IP at startup; if the barber-app
    # container is recreated it gets a new IP and nginx 502s until reloaded.
    resolver 127.0.0.11 valid=10s;
    set $upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # TT11 (HT-04): respaldo por si expose_php se vuelve a activar en php.ini.
        fastcgi_hide_header X-Powered-By;
        # El default de 60s corta el chatbot antes de que Ollama responda
        # (OLLAMA_TIMEOUT=90 en .env); 120s da margen para esa llamada mas lenta.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:env|log|sql|bak|ini|yml|yaml)$ {
        deny all;
    }

    # Alineado con post_max_size en .docker/php/php.ini — nginx rechaza el
    # request antes de llegar a PHP si lo excede.
    client_max_body_size 200M;
}
