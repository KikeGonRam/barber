server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Use Docker's embedded DNS so nginx re-resolves 'app' on each request.
    # Without this nginx caches the resolved IP at startup; if the barber-app
    # container is recreated it gets a new IP and nginx 502s until reloaded.
    resolver 127.0.0.11 valid=10s;
    set $upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # El default de 60s corta el chatbot antes de que Ollama responda
        # (OLLAMA_TIMEOUT=90 en .env); 120s da margen para esa llamada mas lenta.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:env|log|sql|bak|ini|yml|yaml)$ {
        deny all;
    }

    # Alineado con post_max_size en .docker/php/php.ini — nginx rechaza el
    # request antes de llegar a PHP si lo excede.
    client_max_body_size 200M;
}
