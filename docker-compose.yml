services:

  # 🚀 Servidor de Aplicación
  app:
    build: .
    image: barber-app:latest
    container_name: barber-app
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./.docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal

  # 🌐 Servidor Web (NGINX)
  web:
    image: nginx:alpine
    container_name: barber-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  # 👷 Queue Worker
  worker:
    build: .
    container_name: barber-worker
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    networks:
      - internal

  # ⏰ Scheduler
  scheduler:
    build: .
    container_name: barber-scheduler
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    command: php artisan schedule:work
    networks:
      - internal

  # 📧 Mailpit
  mailpit:
    image: axllent/mailpit
    container_name: barber-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal

  # ⚡ Redis
  redis:
    image: redis:alpine
    container_name: barber-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  vendor_data:
