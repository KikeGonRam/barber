services:

  # 🚀 Servidor de Aplicación
  app:
    build: .
    image: barber-app:latest
    container_name: barber-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Chequeo ultra-ligero: ¿Está el puerto 9000 abierto?
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      - internal

  # 🌐 Servidor Web
  web:
    image: nginx:alpine
    container_name: barber-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  # 👷 Queue Worker
  worker:
    build: .
    container_name: barber-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    networks:
      - internal

  # ⏰ Task Scheduler
  scheduler:
    build: .
    container_name: barber-scheduler
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    command: php artisan schedule:work
    networks:
      - internal

  # 📧 Mailpit
  mailpit:
    image: axllent/mailpit
    container_name: barber-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal

  # 🗄️ Database
  mysql:
    image: mysql:8.0
    container_name: barber-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ⚡ Redis
  redis:
    image: redis:alpine
    container_name: barber-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # 🛠️ Adminer
  adminer:
    image: adminer
    container_name: barber-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
