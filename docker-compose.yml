x-app-env: &app-env
  env_file: .env
  dns:
    - 8.8.8.8
    - 8.8.4.4
  volumes:
    - .:/var/www/html
    - vendor_data:/var/www/html/vendor

services:

  # Servidor de aplicacion (PHP-FPM)
  app:
    build: .
    image: barber-app:latest
    container_name: barber-app
    restart: unless-stopped
    <<: *app-env
    # El chatbot llama a Ollama corriendo en el host (Ollama nativo, usa la GPU).
    # extra_hosts garantiza que host.docker.internal resuelva aunque el dns:
    # custom de arriba tape la resolucion automatica de Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./.docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal

  # Servidor web (nginx)
  web:
    image: nginx:alpine
    container_name: barber-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  # Queue worker. Reusa la imagen que "app" ya construyo (misma imagen,
  # comando distinto) en vez de reconstruirla de forma redundante.
  worker:
    image: barber-app:latest
    container_name: barber-worker
    restart: unless-stopped
    <<: *app-env
    depends_on:
      app:
        condition: service_healthy
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    # El HEALTHCHECK del Dockerfile prueba el puerto 9000 (PHP-FPM), pero este
    # contenedor corre "queue:work" y nunca escucha ahi -> reportaria
    # "unhealthy" siempre. Se sobreescribe con un chequeo real del proceso.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  # Scheduler. Misma razon que "worker" para reusar la imagen de "app".
  scheduler:
    image: barber-app:latest
    container_name: barber-scheduler
    restart: unless-stopped
    <<: *app-env
    depends_on:
      app:
        condition: service_healthy
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  # Ollama (LLM local): sirve las predicciones de PredictionService
  # (App\Services\Prediction\PredictionService, hostname 'ollama' hardcodeado
  # ahi) y, opcionalmente, al chatbot si CHATBOT_AI_PROVIDER=ollama en .env.
  # Nota: el comentario de "app" arriba menciona Ollama nativo en el host (GPU)
  # para el chatbot -- ese sigue siendo un camino valido via
  # host.docker.internal, pero PredictionService siempre esperaba este
  # contenedor Docker (nunca existia antes, por eso sus endpoints daban 504).
  # Corre en CPU dentro del contenedor (sin passthrough de GPU); el modelo
  # qwen2.5:0.5b es chico y suficientemente rapido en CPU para este uso.
  ollama:
    image: ollama/ollama:latest
    container_name: barber-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  # MongoDB local para tests de integracion (Feature/DB). Aislado de Atlas
  # a proposito: los tests nunca deben tocar barber_db (compartida con
  # spark/). tests/.env.testing apunta aqui via MONGODB_URI=mongodb://mongo-test:27017.
  mongo-test:
    image: mongo:7
    container_name: barber-mongo-test
    restart: unless-stopped
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # Servidor de correo de pruebas
  mailpit:
    image: axllent/mailpit
    container_name: barber-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal

  # Cache / colas
  redis:
    image: redis:alpine
    container_name: barber-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  vendor_data:
  ollama_data:
