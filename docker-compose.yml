services:

  app:
    build: .
    image: laravel-app
    ports:
      - "8080:80"
    volumes:
      # Montar código para development/testing, pero sin sobrescribir public/build
      - .:/var/www/html
      - /var/www/html/public/build
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      # Evitar montar node_modules y vendor del host
      - /var/www/html/node_modules
      - /var/www/html/vendor
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    env_file:
      - .env
    depends_on:
      mysql:
        # Espera a que MySQL esté REALMENTE listo, no solo iniciado
        condition: service_healthy
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    # Healthcheck: Docker espera hasta que MySQL acepte conexiones
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - laravel

volumes:
  dbdata:

networks:
  laravel:
    driver: bridge