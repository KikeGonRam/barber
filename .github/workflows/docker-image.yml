name: Docker Image CI

# Construye las dos imagenes del repo para detectar a tiempo un Dockerfile roto. No
# publica nada: el despliegue a staging sigue siendo manual (ver
# docs/referencia/DESPLIEGUE_AWS_STAGING.md), porque el CI no tiene credenciales de AWS.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Solo construye imágenes: no necesita escribir en el repositorio ni publicar paquetes.
permissions:
  contents: read

# Cancela solo ejecuciones anteriores del mismo PR; main conserva su evidencia.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        image:
          # Imagen de desarrollo local (docker-compose.yml).
          - name: desarrollo
            dockerfile: Dockerfile
          # Imagen de staging en AWS (PHP-FPM + Caddy). Su build valida el Caddyfile
          # con "caddy validate", asi que tambien protege las cabeceras de seguridad.
          - name: staging
            dockerfile: .docker/staging/Dockerfile

    steps:
    - uses: actions/checkout@v7
    # --pull: siempre la base de PHP más reciente, no una guardada en caché.
    - name: Build the Docker image
      run: docker build . --pull --file ${{ matrix.image.dockerfile }} --tag urbanblade/barber-${{ matrix.image.name }}:${{ github.sha }}

    # T048 (HT-17): construir no basta. El 21-oct-2026 PHP publicó dos fallos críticos de ejecución remota
    # (CVE-2026-109618 y CVE-2026-109619, «PHP2Shell») corregidos en 8.4.27: una imagen con una base más
    # vieja no debe pasar. Al salir un parche nuevo de la serie 8.4, subir este mínimo.
    - name: La imagen trae PHP parchado (8.4.27 o superior)
      env:
        PHP_MINIMO: '8.4.27'
      run: |
        version=$(docker run --rm --entrypoint php urbanblade/barber-${{ matrix.image.name }}:${{ github.sha }} -r 'echo PHP_VERSION;')
        echo "PHP en la imagen: $version (mínimo $PHP_MINIMO)"
        printf '%s\n%s\n' "$PHP_MINIMO" "$version" | sort -V -C
