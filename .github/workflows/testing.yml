name: Testing & Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: ESLint
        run: npm run lint || true

      - name: Prettier
        run: npm run format || true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (style check)
        run: ./vendor/bin/pint --test

  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, curl, mongodb

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.testing .env
      - run: php artisan key:generate

      - name: Run migrations against MongoDB service
        env:
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGO_DATABASE: barber_db_test
        run: php artisan migrate --force

      - name: Run PHPUnit
        env:
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGO_DATABASE: barber_db_test
        run: php artisan test --compact

  frontend-e2e-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, curl, mongodb

      - run: npm ci
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.testing .env
      - run: php artisan key:generate

      - name: Seed a MongoDB database for the E2E run
        env:
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGO_DATABASE: barber_db_e2e
        run: php artisan migrate --seed --force

      - name: Build frontend assets
        run: npm run build

      - name: Start Laravel server
        env:
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGO_DATABASE: barber_db_e2e
        run: php artisan serve --port=8000 &

      - name: Run Cypress Tests
        run: npx cypress run --headless

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm audit --audit-level=moderate || true
