name: SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permisos minimos necesarios para que SonarCloud pueda comentar en PRs
permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    # Exponemos el token como variable de entorno a nivel de job para poder
    # evaluarlo en el paso condicional sin exponer el secreto directamente
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 es obligatorio: SonarCloud necesita el historial
          # completo para calcular "new code" y blame/age de las lineas
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, curl, sqlite3, pdo_sqlite
          tools: composer:v2
          # pcov es mas rapido que xdebug para solo generar cobertura
          coverage: pcov
          ini-values: memory_limit=-1

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Create test database
        run: touch database/database.sqlite

      - name: Run tests with coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan config:clear
          ./vendor/bin/phpunit \
            --coverage-clover=coverage.xml \
            --log-junit=junit.xml

      # El paso de analisis solo se ejecuta si el secreto SONAR_TOKEN esta
      # configurado en el repositorio. Esto evita que el workflow falle en
      # forks o en entornos sin el secreto configurado.
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Skip SonarCloud (no token configured)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::notice::SONAR_TOKEN no esta configurado. El analisis de SonarCloud fue omitido."
          echo "Para activarlo, agrega el secreto SONAR_TOKEN en Settings > Secrets and variables > Actions."
