name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Pint + Larastan + PHPUnit + Coverage)
    runs-on: ubuntu-latest

    env:
      APP_NAME: UrbanBlade
      APP_ENV: testing
      APP_KEY: base64:3tmJ2lribjQ+hBlJrPj8euKIWSImIqTBRGAzXPUFz/0=
      APP_DEBUG: true
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGO_DATABASE: barber_db_test
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: 4
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo-ci -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all

          echo "Esperando a que mongod acepte conexiones..."
          for i in $(seq 1 30); do
            docker exec mongo-ci mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
            sleep 1
          done

          docker exec mongo-ci mongosh --quiet --eval "
            try { rs.status().ok } catch (e) {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})
            }
          "

          echo "Esperando a que el nodo se elija primario..."
          for i in $(seq 1 30); do
            primary=$(docker exec mongo-ci mongosh --quiet --eval "db.hello().isWritablePrimary")
            [ "$primary" = "true" ] && break
            sleep 1
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, bcmath, zip, exif, pcntl, gd, intl, mongodb, redis
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer security audit
        run: composer audit --no-interaction

      - name: Laravel Pint (dry-run)
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --configuration=phpstan.neon.dist

      - name: PHPUnit with coverage
        run: php artisan test --coverage-clover=coverage/coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-coverage
          path: coverage/

  frontend:
    name: Frontend (ESLint + build + audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint resources/js --max-warnings=0

      - name: Build assets
        run: npm run build

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: false
        with:
          sarif_file: trivy-results.sarif

  smoke:
    name: Smoke test (HTTP routes)
    needs: [backend]
    runs-on: ubuntu-latest

    env:
      APP_NAME: UrbanBlade
      APP_ENV: testing
      APP_KEY: base64:3tmJ2lribjQ+hBlJrPj8euKIWSImIqTBRGAzXPUFz/0=
      APP_DEBUG: true
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGO_DATABASE: barber_db_test
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: 4
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo-smoke -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-smoke mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
            sleep 1
          done

          docker exec mongo-smoke mongosh --quiet --eval "
            try { rs.status().ok } catch (e) {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})
            }
          "

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, bcmath, zip, exif, pcntl, gd, intl, mongodb, redis
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel app
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan migrate --force --seed

      - name: Start app and verify routes
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 >/tmp/urbanblade.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/login >/dev/null && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/ >/tmp/index.html
          curl -fsS http://127.0.0.1:8000/login >/tmp/login.html
          grep -qi "UrbanBlade\|Bienvenido" /tmp/index.html /tmp/login.html
