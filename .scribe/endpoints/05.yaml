name: 'Gestión de Chatbot'
description: |-

  Endpoints para gestionar el chatbot (historial, perfil, estadísticas).
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/chatbot/history
    metadata:
      custom: []
      groupName: 'Gestión de Chatbot'
      groupDescription: |-

        Endpoints para gestionar el chatbot (historial, perfil, estadísticas).
      subgroup: ''
      subgroupDescription: ''
      title: 'Historial de Conversaciones (API)'
      description: |-
        Devuelve el historial de conversaciones del usuario con el chatbot.
        A diferencia del widget Blade (sesión), este endpoint lo consume un
        cliente Bearer-token sin cookie (Nuxt) que nunca conserva sesión
        entre requests — por eso lee de la copia persistida en Mongo
        (ChatbotContextService::getPersistedHistory()) en vez de la sesión.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"message":"No autorizado."}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          access-control-allow-origin: 'http://localhost:3000'
        description: null
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
