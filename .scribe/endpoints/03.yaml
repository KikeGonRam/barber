        Autoriza el token opaco de la cita, no una sesión
        (AppointmentManageLinkService). Aplica exactamente las mismas reglas que
        el cliente autenticado: solo citas pendientes/confirmadas y futuras, y la
        ventana de cancelación configurada por la barbería. El enlace no puede ser
        una puerta más permisiva que la app.
      subgroup: ''
      subgroupDescription: ''
      title: 'Ver cita'
      description: ''
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      appointment_code:
        custom: []
        name: appointment_code
        description: ''
        required: true
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      appointment_code: architecto
    queryParameters:
      t:
        custom: []
