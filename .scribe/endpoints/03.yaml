    custom: []
    httpMethods:
      - GET
    uri: 'api/v1/appointments/{appointment_code}/manage'
    metadata:
      custom: []
      groupName: 'Gestión de cita por enlace'
      groupDescription: |-

        Deja que un cliente vea, reagende o cancele SU cita desde el enlace del
